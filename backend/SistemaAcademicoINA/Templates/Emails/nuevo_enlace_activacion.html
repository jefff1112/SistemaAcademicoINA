<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8" /></head>
<body style="margin:0;padding:0;background:#EEF1F9;font-family:Arial,sans-serif;">
  <div style="max-width:600px;margin:auto;background:#ffffff;border:1px solid #dddddd;border-radius:8px;overflow:hidden">
    <div style="background:#1A2E6B;color:#ffffff;padding:20px;text-align:center">
      <h2 style="margin:0">Instituto Nacional de Apopa</h2>
    </div>
    <div style="padding:24px;color:#333333">
      <h3>Hola, {{nombreEstudiante}}</h3>
      <p>Se ha generado un nuevo enlace para activar tu cuenta. Da clic en el siguiente botón para crear tu contraseña:</p>
      <p style="text-align:center;margin:24px 0">
        <a href="{{enlace}}" style="background:#2B47B8;color:#ffffff;padding:12px 24px;text-decoration:none;border-radius:6px">Activar mi cuenta</a>
      </p>
      <p style="color:#777777">Este enlace expira en 48 horas.</p>
    </div>
  </div>
</body>
</html>
